# Portable base for the infra-mngmt dev container (committed, shareable).
#
# Personal / machine-specific bind mounts (Windows-side config, sibling-project
# checkouts, …) do NOT belong here — put them in docker-compose.override.yml,
# which is committed as a no-op and meant to be customized locally. Both files
# are listed in devcontainer.json's `dockerComposeFile`, and Compose merges a
# service's `volumes` by container mount-path, so the override only ever ADDS
# to what's defined here.
services:
  app:
    build:
      # Context is .devcontainer (this file's dir) so `COPY init-firewall.sh`
      # in the Dockerfile resolves — matches the old devcontainer.json default.
      context: .
      dockerfile: Dockerfile
      args:
        TZ: "${TZ:-America/Los_Angeles}"
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    # Seed host.docker.internal so the name exists from first boot. NOTE:
    # `host-gateway` resolves to the *default-bridge* gateway (172.17.0.1), NOT
    # this Compose network's gateway — and host services (the ident-browser MCP
    # in .mcp.json) answer on the Compose gateway (the container's default
    # route, e.g. 172.22.0.1), so this entry alone points at a dead IP.
    # init-firewall.sh (postStartCommand, runs as root) REWRITES this entry to
    # the real default-route gateway on every start — that's what actually makes
    # host.docker.internal reachable. See docs/proposals/ui-audit-2026-06.md §C.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # init-firewall.sh needs these (was runArgs in devcontainer.json).
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
    # Publish the design-iteration proto-server to the WSL host on 0.0.0.0 so
    # ident-browser can reach it via the docker bridge gateway (172.17.0.1) —
    # the container side must bind 0.0.0.0:7843 (see `make proto`).
    ports:
      - "7843:7843"
    volumes:
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
      - gh-config:/home/node/.config/gh
      # The repo itself, at /workspace. `..` is relative to this compose file
      # (.devcontainer) → the repo root.
      - ..:/workspace
      # infra-mngmt's own config dir — portable via ${HOME} (no hard-coded
      # username). Powers the deploy flow (reads /wsl-config/token) and host
      # diagnostics. On a machine without this dir, Docker creates an empty one.
      - ${HOME}/.config/infra-mngmt:/wsl-config
    # devcontainer `overrideCommand` defaults to false for Compose, so the
    # service command must not exit or the container would stop immediately.
    command: sleep infinity

# Volume names are load-bearing: renaming a named volume is a DATA MIGRATION,
# not a config edit — Compose points the container at a *different* volume and
# the old data is orphaned (not moved). See the README "Dev container volumes"
# note before changing any name here.
volumes:
  # Project-scoped — Compose prefixes these with the project name, giving one
  # stable volume per project. Intentional: replaces the old
  # ${devcontainerId}-suffixed names that minted a fresh pair every rebuild and
  # piled up orphans. (On the migration rebuild these started empty; restore
  # prior data with the cp -a one-liner in the README.)
  claude-code-bashhistory:
  claude-code-config:
  # Shared across all of your devcontainers (as the old unsuffixed names were).
  # `name:` pins the literal volume so Compose does NOT project-prefix/re-scope
  # it. Deliberately NOT `external: true`: external would re-attach the existing
  # shared volume on this machine but FAIL on a fresh one (external volumes must
  # pre-exist) — which is exactly the portability the Compose move was for.
  # `name:` (no external) gives the same re-attach on your machine AND auto-
  # creates on a fresh one. (Trade-off: a stray `docker compose down -v` could
  # delete a name-pinned volume; external would prevent that. Devcontainers
  # don't run `down -v`, so the portability win wins.)
  gh-config:
    name: gh-config
